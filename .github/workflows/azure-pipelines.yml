# =========================================================================
# TRIGGER: Ejecución automática al hacer cambios en la rama main (Parte 8)
# =========================================================================
name: Pipeline Multistage .NET (Tareas 3-8)

on:
  push:
    branches:
      - main

jobs:
  # =========================================================================
  # PARTE 5: Configurar Stage CI (Integración Continua)
  # Objetivo: Validar integración continua, restauración y compilación exitosa.
  # =========================================================================
  BuildJob:
    name: 'Stage CI: BuildJob'
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # Step 1: Instalar .NET SDK
      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x' # Puedes cambiarlo a '6.x' o '7.x' según tu proyecto

      # Step 2: Restaurar dependencias (Verificación Parte 3)
      - name: Restaurar dependencias
        run: dotnet restore

      # Step 3: Compilar aplicación (Build exitoso Parte 3)
      - name: Compilar aplicación
        run: dotnet build --configuration Release --no-restore

  # =========================================================================
  # PARTE 6: Configurar Stage Testing
  # Objetivo: Automatizar validación de calidad.
  # El parámetro 'needs: BuildJob' asegura el flujo obligatorio CI -> Testing
  # =========================================================================
  TestJob:
    name: 'Stage Testing: TestJob'
    runs-on: ubuntu-latest
    needs: BuildJob # Si CI falla, este stage NO se ejecuta (Flujo Obligatorio)
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # Step 1, 2 y 3: Ejecutar pruebas unitarias, mostrar resultados y validar errores
      - name: Ejecutar pruebas unitarias
        run: dotnet test --configuration Release --logger trx

  # =========================================================================
  # PARTE 7: Configurar Stage Delivery
  # Objetivo: Preparar aplicación para despliegue y confirmar entrega.
  # El parámetro 'needs: TestJob' asegura el flujo obligatorio Testing -> Delivery
  # =========================================================================
  DeliveryJob:
    name: 'Stage Delivery: DeliveryJob'
    runs-on: ubuntu-latest
    needs: TestJob # Si Testing falla, este stage NO se ejecuta (Flujo Obligatorio)
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # Step 1: Publicar aplicación
      - name: Publicar aplicación
        run: dotnet publish --configuration Release --output ./publish_output

      # Step 2 y 3: Generar artefactos y Confirmar entrega
      - name: Confirmar entrega (Generar artefactos)
        uses: actions/upload-artifact@v4
        with:
          name: artefactos-aplicacion
          path: ./publish_output