# Trigger: Se ejecuta automáticamente al hacer push a main (Parte 8)
trigger:
- main

pool:
  vmImage: 'ubuntu-latest' # Servidor en la nube donde se ejecutará el pipeline

stages:

# ==========================================
# PARTE 5: Configurar Stage CI
# ==========================================
- stage: CI
  displayName: 'Stage: Integración Continua'
  jobs:
  - job: BuildJob
    displayName: 'Job: Compilación de Aplicación'
    steps:
    # 1. Instalar .NET SDK
    - task: UseDotNet@2
      displayName: 'Instalar .NET SDK'
      inputs:
        packageType: 'sdk'
        version: '8.x' # Cambia a 6.x o 7.x si tu proyecto usa una versión anterior

    # 2. Restaurar dependencias
    - task: DotNetCoreCLI@2
      displayName: 'Restaurar dependencias (dotnet restore)'
      inputs:
        command: 'restore'
        projects: '**/*.csproj'

    # 3. Compilar aplicación
    - task: DotNetCoreCLI@2
      displayName: 'Compilar aplicación (dotnet build)'
      inputs:
        command: 'build'
        projects: '**/*.csproj'
        arguments: '--configuration Release'

# ==========================================
# PARTE 6: Configurar Stage Testing
# ==========================================
- stage: Testing
  displayName: 'Stage: Pruebas Unitarias'
  dependsOn: CI # Obliga al flujo CI -> Testing. Si CI falla, este no corre.
  condition: succeeded()
  jobs:
  - job: TestJob
    displayName: 'Job: Ejecución de Pruebas'
    steps:
    # 1. Ejecutar pruebas unitarias, 2. Mostrar resultados y 3. Validar errores
    - task: DotNetCoreCLI@2
      displayName: 'Ejecutar Pruebas (dotnet test)'
      inputs:
        command: 'test'
        projects: '**/*Tests/*.csproj' # Busca proyectos de prueba (ajusta la ruta si es necesario)
        arguments: '--configuration Release --logger trx' # El logger guarda resultados

# ==========================================
# PARTE 7: Configurar Stage Delivery
# ==========================================
- stage: Delivery
  displayName: 'Stage: Entrega Continua'
  dependsOn: Testing # Obliga al flujo Testing -> Delivery. Si Testing falla, este no corre.
  condition: succeeded()
  jobs:
  - job: DeliveryJob
    displayName: 'Job: Preparar Artefactos'
    steps:
    # 1. Publicar aplicación
    - task: DotNetCoreCLI@2
      displayName: 'Publicar Aplicación (dotnet publish)'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: true

    # 2. Generar artefactos (Subirlos a Azure DevOps)
    - task: PublishBuildArtifacts@1
      displayName: 'Confirmar entrega (Publicar Artefactos)'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'